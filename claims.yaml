- id: numwords-l71
  kind: definition
  passage: '*Proof.* Laplace expansion along the two rows writes the determinant (permanent) of the matrix as $\sum_{s<t}\pm\varphi_{st}(x,y)\,M_{st}$, where $\varphi_{st}(x,y)=x_sy_t-x_ty_s$ (respectively $x_sy_t+x_ty_s$) and $M_{st}$ is the complementary $(n-2)\times(n-2)$ minor (permanent) of the other rows. The $M_{st}$ are multilinear polynomials in the other rows'' entries with pairwise disjoint sets of monomials, and a multilinear polynomial that vanishes everywhere on $\mathbb{F}$ is zero. Hence $\Phi$ preserves the value for every completion if and only if $\varphi_{st}(\Phi(x,y))=\varphi_{st}(x,y)$ for all $s<t$ and all $x,y$.'
  rationale: 'Number words that are constants of the model definition, theorem statements or proof steps, not empirical results. Proof step: Laplace expansion along the two rows of the pair.'
- id: numwords-l73
  kind: definition
  passage: 'Write $\Phi(x,y)=(L,M)$ with coordinates $L_s,M_s$, linear forms in the $2n$ variables. Since $|\mathbb{F}|\ge 3$, the identity $L_sM_t\pm L_tM_s=\varphi_{st}$ holds as polynomials. The quadratic form $\varphi_{st}$ has rank four and involves exactly $x_s,x_t,y_s,y_t$. The symmetric matrix of $L_sM_t\pm L_tM_s$ has its row space inside the span of $L_s,M_t,L_t,M_s$, so these four forms are independent and span $\langle x_s,x_t,y_s,y_t\rangle$. Taking two different partners $t,u$ of $s$, which needs $n\ge 3$, gives $\langle L_s,M_s\rangle=\langle x_s,y_s\rangle$: each new column depends only on the same old column, $(L_s,M_s)^{\top}=g_s(x_s,y_s)^{\top}$. Substituting, $\varphi_{st}(\Phi)=w_s^{\top}g_s^{\top}Hg_tw_t$ with $w_s=(x_s,y_s)^{\top}$ and $H=J$ (respectively $K$), so $g_s^{\top}Hg_t=H$ for all $s\neq t$. With three indices this forces all $g_s$ to be one matrix $g$ with $g^{\top}Hg=H$. For $H=J$ this is $\det g=1$. For $H=K$, writing $g=\begin{psmallmatrix}a&b\\c&d\end{psmallmatrix}$ gives $2ac=0$, $2bd=0$ and $ad+bc=1$, whose solutions are the two monomial families. The converse is a direct check. $\square$'
  rationale: 'Number words that are constants of the model definition, theorem statements or proof steps, not empirical results. Proof steps: field size at least 3 (char not 2), rank four of the pair form, four independent linear forms, two partners and three indices (n >= 3), one common matrix, two monomial families.'
