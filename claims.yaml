- id: numwords-para-01
  kind: definition
  passage: 'The lead of a nonzero row is the index of its first nonzero entry. A matrix is readable when its rows have pairwise distinct leads. Sorting the rows by lead then gives an upper triangular matrix, so $\det A=\operatorname{sgn}(\pi)\prod_i r_i[\operatorname{lead}(r_i)]$, where $\pi$ is the sorting permutation, and $\operatorname{perm}A=\prod_i r_i[\operatorname{lead}(r_i)]$. An observer needs only the triple (agent, lead, pivot value) from each agent. When leads repeat, these summaries do not determine the determinant: some column $j$ is nobody''s lead, and multiplying column $j$ by $t\neq 1$ changes no lead and no pivot value while multiplying the determinant by $t$.'
