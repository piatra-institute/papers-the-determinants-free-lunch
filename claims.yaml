- id: numwords-para-18
  kind: definition
  passage: The permanent's missing moves are a statement about fixed linear moves, and, by Theorem 6, about almost all pairs once $n\ge 5$ and the field is large. At $n=3$, and for many pairs over small fields, state-dependent permanent-preserving moves exist, some with closed forms, and they make full progress at $n=3$ and substantial progress at $n=4$ and $n=5$. The oracle experiments measure what one greedy rule achieves with these moves; they say nothing about the cost of finding the moves and are not a computational lower bound.
  rationale: Number words and digits in this passage are constants of the model definition, theorem statements, proof steps, formula constants or labels, or restate counts bound by computation claims elsewhere; none is a new empirical result.
- id: numwords-para-19
  kind: definition
  passage: 'None of this bears directly on VP versus VNP, which remains open. An efficient algorithm for the permanent need not preserve the permanent at intermediate steps, so the absence of permanent-preserving eliminations is not a lower bound. The pair-local theorems are localised versions of the classical global preserver theorems, and the collective protocol is a distributed form of Gaussian elimination; their contribution is an exact, testable account of when locally blind agents can expose a global invariant and of which symmetry makes that possible. The experiments establish this for one designed protocol, a family of greedy policies and small fields. They do not measure causal emergence in any formal sense, and they show no learning, planning or behaviour outside what the stated rules imply. Open questions remain where the computations stop: a useful prediction of completion time from graph bottlenecks, and which matrices over small fields can reach a readable form through state-dependent permanent-preserving moves when $n\ge 4$.'
