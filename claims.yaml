- id: numwords-l89
  kind: definition
  passage: 'The census shows that freezing depends strongly on size. At $n=3$ no independent pair is frozen, and the exhaustive reachability computation over all $3\times 3$ matrices over $\mathbb{F}_5$ found that every one of the 1,513,600 matrices with nonzero permanent can reach a readable form through permanent-preserving pair moves, on the complete graph and on the path alike, with the matrices of each permanent value forming a single class. Only 48,000 of them are readable to begin with, which is what linear moves can exploit. At $n=3$ the permanent''s local rigidity is therefore a property of fixed linear moves and disappears once moves may depend on the state. The extra moves can have closed forms: with $a,b,c$ the pair permanents on column pairs $\{1,2\},\{1,3\},\{2,3\}$ and $b\neq 0$, the replacement $u=(1,c/b,0)$, $v=(0,a,b)$ has the same pair permanents and creates two zeros. At $n=5$ over $\mathbb{F}_5$, 6,328,320 of the 9,746,880 independent pairs are frozen, and 458 of 20,000 uniformly random matrices have all ten row pairs frozen. Over these small fields many pairs are special, so most matrices still admit some extra move. The rigidity returns over larger fields, for a reason identified in factor analysis.'
  rationale: 'Number words that are constants of the model definition, theorem statements or proof steps, not empirical results. Worked identity: the closed-form replacement has two zeros, checked symbolically in the text.'
- id: numwords-l91
  kind: definition
  passage: Write $S=xy^{\top}+yx^{\top}$ for a pair $(x,y)$. Its off-diagonal entries $S_{st}=x_sy_t+x_ty_s$ are exactly the pair permanents, and its diagonal entries $2x_sy_s$ are not observed. A replacement $(u,v)$ is admissible when $S'=uv^{\top}+vu^{\top}$ agrees with $S$ off the diagonal. Recovering a low-rank symmetric matrix from its off-diagonal entries is the identification problem of factor analysis, where Anderson and Rubin showed that a rank-$m$ factor structure is identified when deleting any row leaves two disjoint submatrices of rank $m$ [@anderson1956, p. 118]; the algebraic geometry of such models is developed by Drton, Sturmfels and Sullivant [@drton2007]. The same argument applies here over any field of characteristic other than two.
