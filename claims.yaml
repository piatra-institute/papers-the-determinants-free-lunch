  kind: definition
  passage: '**Theorem 3 (the protocol).** Suppose the graph is fixed, each edge is offered for contact at each step with probability at least $p_{\min}>0$ independently of the past, and $0<\beta\le 1$. If $q=0$ the protocol reaches a readable matrix with probability one, and once readable it stays readable. If $q>0$ it never reaches one, and with probability one it reaches the bound $n-q$ of Theorem 2.'
