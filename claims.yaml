  rationale: 'Number words that are constants of the model definition, theorem statements or proof steps, not empirical results. Model definition: one row per agent, one neighbour per contact.'
- id: numwords-l15
  kind: definition
  passage: 'For the determinant the answer is yes, and the reason is elementary: subtracting a multiple of one row from another, or exchanging two rows while negating one of them, multiplies the determinant by one. Two agents can apply these moves using only their own two rows, so a global quantity is preserved by operations that are each local and blind to it. The same question for the permanent, $\operatorname{perm} A=\sum_{\sigma}\prod_i a_{i\sigma(i)}$, has a different answer, and the difference is the subject of this paper.'
  rationale: 'Number words that are constants of the model definition, theorem statements or proof steps, not empirical results. Definition of the moves: one row subtracted from another, two rows exchanged with one negated; determinant multiplier one; two agents act on their two rows.'
- id: numwords-l19
  kind: definition
  passage: The answer has three parts. The capacity comes from the group of determinant-one row operations, and on any communication graph the moves of adjacent pairs generate the whole of that group on each connected component. Whether the agents can reach a readable form is decided by an exact criterion that combines the graph with the information each component holds. For the permanent, the linear moves of a row pair that preserve it in every matrix are only scalings and exchanges, so they never create a zero. When agents may instead choose any permanent-preserving replacement of their two rows as a function of what they see, the picture changes at small sizes, and the measured advantage of the determinant appears only as $n$ grows.
  rationale: 'Number words that are constants of the model definition, theorem statements or proof steps, not empirical results. Summary of the model: a replacement acts on two rows.'
- id: numwords-l21
  kind: definition
  passage: 'Related work spans three areas that rarely meet. Distributed computing has studied systems in which local steps maintain a global property: Dijkstra''s self-stabilising systems keep the relation "the system is in a legitimate state" invariant under the steps of loosely coupled processes [@dijkstra1974]; gossip algorithms compute averages through random pairwise exchanges [@boyd2006]; algebraic gossip spreads messages through random linear coding over finite fields [@deb2006]; population protocols characterise what pairwise interactions of finite-state agents can compute [@angluin2006]; and generic pairwise elimination has been parallelised with attention to communication cost [@tiskin2007]. Algebraic complexity theory separates the determinant, computable by polynomial-size circuits, from the permanent, which is complete for Valiant''s class VNP in characteristic other than two [@valiant1979classes; @burgisser2000]; computing the permanent of a 0-1 matrix is #P-complete [@valiant1979permanent]. Whether VP differs from VNP is open. Geometric complexity theory recasts such lower-bound questions as questions about orbits under reductive group actions [@mulmuley2001]. The classical linear preserver theorems identify the global symmetries involved: the linear maps preserving the determinant of every matrix are $X\mapsto UXV$ or $X\mapsto UX^{\top}V$ with $\det(UV)=1$, a result that goes back to Frobenius and was extended to general fields by Dieudonné [@li2001; @dieudonne1949], while the permanent''s linear preservers are products of permutation and diagonal matrices, possibly with a transpose [@marcus1962; @botta1967]. Marcus and May prove the permanent statement as a case of a theorem on linear maps of rectangular matrices that preserve all permanental compounds of a given order [@marcus1962, p. 179]. The results below are a localised version of this contrast: which symmetries are available to two rows acting alone, and what a network of such pairs can then achieve.'
  rationale: 'Number words that are constants of the model definition, theorem statements or proof steps, not empirical results. Hypotheses and scope: characteristic other than two (classical completeness hypothesis) and two rows acting alone (the pair-local setting).'
- id: numwords-l25
  kind: definition
