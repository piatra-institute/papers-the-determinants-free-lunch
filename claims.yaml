- id: numwords-para-12
  kind: definition
  passage: To measure what the extra moves buy at small fields, the last experiment gave agents on the complete graph an oracle for every value-preserving replacement of their two rows and let each contact choose, uniformly among the replacements, one that maximises the sum of the two leads. Both polynomials were run on the same matrices, drawn uniformly subject to nonzero determinant and nonzero permanent, with the same contact schedule. For the determinant this rule reproduces elimination, and the agents completed 200 of 200 matrices in each of the five settings. For the permanent they completed 200 of 200 at $n=3$ and 200 of 200 at $n=4$ over $\mathbb{F}_5$, 105 of 200 at $n=5$ over $\mathbb{F}_5$, 164 of 200 at $n=5$ over $\mathbb{F}_3$, and 87 of 200 at $n=6$ over $\mathbb{F}_3$, each with a budget of 3,000 contacts (Figure 1d). The greedy rule is one policy, so a failure shows that this rule stalls, not that no sequence of permanent-preserving moves exists.
