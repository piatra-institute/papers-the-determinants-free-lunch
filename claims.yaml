- id: numwords-para-10
  kind: definition
  passage: '*Proof.* Let $(u,v)$ be admissible and fix $i$ with its sets $I,J$. The entries of $S''$ in rows $\{i\}\cup I$ and columns $\{i\}\cup J$ other than $S''_{ii}$ are off-diagonal, so they equal those of $S$. This $3\times 3$ submatrix has rank at most two and an invertible block $S[I,J]$, so its Schur complement vanishes: $S''_{ii}=S[i,J]\,S[I,J]^{-1}S[I,i]$, which is also $S_{ii}$. Hence $S''=S$. An invertible $2\times 2$ submatrix makes $\operatorname{rank}S=2$, so $x,y$ are independent, and the column space of $S$ is $\langle x,y\rangle=\langle u,v\rangle$. Writing $(u,v)^{\top}=g(x,y)^{\top}$ gives $S=X K X^{\top}$ and $S''=X g^{\top}KgX^{\top}$ with $X=[x\ y]$ of full column rank, so $g^{\top}Kg=K$ and $g$ is one of the monomial matrices of Theorem 4. For the bound, fix for each $i$ one choice of $I=\{a,b\}$, $J=\{c,d\}$. Then $\det S[I,J]$ is a polynomial of degree four in $(x,y)$, and it is not identically zero because $x=e_a+e_d$, $y=e_b+e_c$ makes $S[I,J]$ the identity. By the Schwartz bound [@schwartz1980] it vanishes with probability at most $4/p$; a union bound over the $n$ coordinates, and then over the $n(n-1)/2$ row pairs, gives the two estimates. $\square$'
