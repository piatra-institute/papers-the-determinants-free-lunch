- id: numwords-para-17
  kind: definition
  passage: 'Theorems 1 to 4 make one reading of the free lunch exact. The determinant does not have to be known, estimated or transmitted for local agents to protect it: each permitted move is a determinant-one map of two rows, and these maps generate the full determinant-one group on every connected component. That group is large enough that its orbits are the level sets of a short list of invariants, and among its elements are the transvections that eliminate entries. The permanent''s two-row linear symmetries are scalings and exchanges, which preserve every zero pattern. In that sense the determinant''s local capacity is a consequence of its symmetry group, and the permanent lacks the corresponding local moves.'
