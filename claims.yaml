- id: numwords-l51
  kind: definition
  passage: '*Proof.* Let $\Phi=\sum_i\operatorname{lead}(r_i)$. A swap leaves $\Phi$ unchanged and an elimination strictly increases the recipient''s lead (the recipient stays nonzero because the rows stay independent), so $\Phi$ increases at most $n(n-1)$ times. Suppose some component contains two rows with the same lead $\ell$. Choose such a pair at minimum distance in $G$ and a shortest path between them. No interior vertex of the path holds a row with lead $\ell$, so the signed swaps along the path are permitted, carry one of the two rows (possibly negated, which keeps its lead) next to the other in at most $L-1$ contacts, where $L$ is the largest component size minus one, and the next contact eliminates. This sequence has probability at least $\alpha=p_{\min}^{L}\beta^{L-1}>0$ in every block of $L$ offers, whatever happened before, so an increase of $\Phi$ occurs with probability one. After the last increase every component has distinct leads, which by Theorem 2 are exactly $P_C$. Contacts only occur inside components, so no further elimination happens and swaps only permute rows within components. If $q=0$ this state is readable; if $q>0$, Theorem 2 rules out readability. $\square$'
