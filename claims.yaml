- id: numwords-para-16
  kind: definition
  passage: The remaining rules sit between the two polynomials, and a simple projection shows where hardness enters. If $E$ contains every pair inside a set $T$ of rows, setting each row outside $T$ to its unit vector and the entries of rows in $T$ outside the columns of $T$ to zero gives $D_E(A)=\operatorname{perm}(S\circ A_T)$ for an explicit sign matrix $S$. A circuit for $D_E$ therefore yields a circuit of the same size, plus sign changes, for the permanent of size $|T|$, so a family $D_{E_n}$ whose clique sizes grow polynomially in $n$ is as hard as the permanent up to polynomial factors. All 20 numerical checks of this identity, at $n=6$ and $n=7$, passed. Whether rules without large cliques, and without cut structure, can be computed efficiently was not determined.
