  kind: definition
  passage: An exhaustive search confirmed Theorem 4 on small cases without assuming linearity of any particular shape. A quadratic map is preserved by a linear map exactly when its values on a basis and its polar form on pairs of basis vectors are preserved, so a backtracking search over images of basis vectors finds every linear preserver. For $n=3$ over $\mathbb{F}_3$ it found 24 determinant preservers and 4 permanent preservers; over $\mathbb{F}_5$, 120 and 8; for $n=4$ over $\mathbb{F}_3$, again 24 and 4. These are the orders of $\mathrm{SL}_2(\mathbb{F}_p)$ and of the monomial group of Theorem 4, and every preserver found had the stated form. Over $\mathbb{F}_2$ both searches found the 6 elements of $\mathrm{SL}_2(\mathbb{F}_2)$. For $n=2$ over $\mathbb{F}_3$ the search found 1,152 determinant preservers, because when the pair is the whole matrix column operations are also local; this is why the theorem needs $n\ge 3$.
