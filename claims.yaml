  kind: definition
  passage: 'The protocol used in the experiments is a specific determinant-preserving policy. On a contact along $\{i,j\}$ with $i<j$: if the two leads are equal to $c$, agent $j$ sets $r_j\leftarrow r_j-(r_j[c]/r_i[c])\,r_i$; if they differ, the pair performs the signed swap $(r_i,r_j)\leftarrow(r_j,-r_i)$ with probability $\beta$ and otherwise does nothing. Both operations act on the pair by a $2\times 2$ matrix of determinant one. An unsigned swap has determinant $-1$ and would flip the sign of $\det A$.'
