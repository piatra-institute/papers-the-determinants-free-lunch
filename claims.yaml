- id: numwords-para-14
  kind: definition
  passage: '*Proof.* The coefficient of $\prod_i a_{i\sigma(i)}$ in $D_E$ is $\operatorname{sgn}(\sigma)(-1)^{\operatorname{inv}_E(\sigma)}$, so $D_E$ is a signed determinant exactly when $(-1)^{\operatorname{inv}_E(\sigma)}=c\prod_i s_{i\sigma(i)}$ for all $\sigma$. For a cut, counting crossing inversions modulo two gives $\operatorname{inv}_E(\sigma)\equiv\sum_{i\in S}(i+\sigma(i))+\text{const}$, which has this form. Conversely, restricting to permutations that move only three rows $i<j<k$ among the columns $\{i,j,k\}$ turns inversions with fixed rows into entry-dependent signs, so $E$ restricted to $\{i,j,k\}$ must itself be admissible for $n=3$; enumeration of the eight graphs on three vertices shows this means $|E\cap\{ij,ik,jk\}|$ is even. A set of edges of the complete graph meeting every triangle evenly is a cut, because triangles span its cycle space over $\mathrm{GF}(2)$. The permanent case is the same argument for the pairs that keep their sign. $\square$'
