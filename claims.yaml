- id: numwords-para-05
  kind: definition
  passage: '**Theorem 4 (pair-local linear preservers).** Let $\mathbb{F}$ have characteristic other than two, let $n\ge 3$, and let $\Phi$ be a linear map of pairs of rows. Then $\Phi$ preserves the determinant of every $n\times n$ matrix containing the pair if and only if $\Phi(x,y)=(ax+by,\,cx+dy)$ with $g=\begin{psmallmatrix}a&b\\c&d\end{psmallmatrix}$ satisfying $g^{\top}Jg=J$, $J=\begin{psmallmatrix}0&1\\-1&0\end{psmallmatrix}$, that is $\det g=1$. It preserves the permanent of every such matrix if and only if $\Phi$ has the same form with $g^{\top}Kg=K$, $K=\begin{psmallmatrix}0&1\\1&0\end{psmallmatrix}$, that is $g=\begin{psmallmatrix}\alpha&0\\0&\alpha^{-1}\end{psmallmatrix}$ or $g=\begin{psmallmatrix}0&\alpha\\ \alpha^{-1}&0\end{psmallmatrix}$.'
