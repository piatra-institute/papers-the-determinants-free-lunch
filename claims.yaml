- id: def-readable
  kind: definition
  passage: A matrix is readable when its rows have pairwise distinct leads.
  rationale: Target state for collective computation; the readout identity follows from triangularity.
- id: def-profile
  kind: definition
  passage: For a subspace $W\subseteq\mathbb{F}^n$, its pivot profile $P(W)$ is the set of leads of its nonzero vectors.
  rationale: Standard echelon-form notion; used to state the obstruction index.
- id: def-q
  kind: definition
  passage: Because the rows are independent, $\sum_C|P_C|=n$, so $q=0$ exactly when the profiles of the components are pairwise disjoint.
  rationale: Defines when q vanishes; follows from |P(W)| = dim W.
- id: thm-orbits
  kind: interpretation
  passage: '**Theorem 1 (orbits).** Let $\Gamma_G$ be the group generated by all pair moves $(r_i,r_j)\mapsto(ar_i+br_j,\,cr_i+dr_j)$ with $ad-bc=1$ along edges of $G$.'
  rationale: Proved in the text from the commutator relation for transvections; checked by union-find orbits in the exhaustive enumeration.
- id: thm-readability
  kind: interpretation
