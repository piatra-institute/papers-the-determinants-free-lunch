- id: numwords-l37
  kind: definition
  passage: '**Theorem 1 (orbits).** Let $\Gamma_G$ be the group generated by all pair moves $(r_i,r_j)\mapsto(ar_i+br_j,\,cr_i+dr_j)$ with $ad-bc=1$ along edges of $G$. Then $\Gamma_G=\prod_C \mathrm{SL}_{|C|}(\mathbb{F})$, each factor acting on the rows held in one component. Consequently a matrix $B$ is reachable from an invertible $A$ exactly when, for every component $C$, the exterior product of the rows of $B$ held in $C$, taken in index order, equals that of $A$.'
  rationale: 'Number words that are constants of the model definition, theorem statements or proof steps, not empirical results. Constants of the theorem statement: one group factor per component.'
- id: numwords-l39
  kind: definition
  passage: '*Proof.* Each generator is block diagonal with determinant-one blocks, which gives one inclusion. For the other, write $E_{ij}(t)$ for the move $r_j\leftarrow r_j+t\,r_i$. For distinct $i,k,j$ the commutator of $E_{ik}(s)$ and $E_{kj}(t)$ is $E_{ij}(\pm st)$, so by induction along a path every $E_{ij}(t)$ with $i,j$ in the same component lies in $\Gamma_G$. These elementary transvections generate $\mathrm{SL}_{|C|}(\mathbb{F})$ over any field. For the orbit statement, the rows of $A$ in $C$ form a basis of $W_C$, and two ordered bases of the same subspace differ by a determinant-one change of basis exactly when their exterior products agree; a nonzero decomposable exterior product determines its subspace. $\square$'
  rationale: 'Number words that are constants of the model definition, theorem statements or proof steps, not empirical results. Proof step: two ordered bases of one subspace.'
- id: numwords-l45
  kind: definition
