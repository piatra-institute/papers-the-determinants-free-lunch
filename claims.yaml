  kind: definition
  passage: 'With Corollary 5, Theorem 6 says that for $n\ge 5$ and $p$ large compared with $n^3$, almost every matrix is confined to its scaling-and-exchange orbit even when permanent-preserving agents may choose their moves from the state. The certificate is sufficient, not necessary. The exhaustive census found no certified pair that is not frozen: at $n=5$ over $\mathbb{F}_5$, 6,266,880 of the 6,328,320 frozen pairs are certified, and at $n=6$ over $\mathbb{F}_3$, 337,920 of 407,040. In seeded samples of 200,000 pairs, 199,689 were certified at $n=5$ over $\mathbb{F}_{101}$, where the bound guarantees at least 80% (it gives $1-20/101$), and 19,998 of 20,000 random $5\times 5$ matrices over $\mathbb{F}_{1009}$ had every row pair certified. On 10,000 certified coordinates the diagonal recovery formula reproduced $2x_iy_i$ with no errors.'
