web_blurb: Agents that each hold one row of a matrix, and see only a neighbour's row, can protect its determinant without ever knowing it. The paper proves exactly when such blind agents can bring the determinant into view, traces the capacity to the determinant's symmetries, and shows that fixed two-row moves preserving the permanent are only scalings and exchanges, which never create a zero.
