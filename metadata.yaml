abstract: 'Agents that each hold one row of an invertible matrix over a finite field, and see only their own row and a neighbour''s, can preserve the determinant without observing it: subtracting multiples of rows and exchanging rows with a sign change are determinant-one maps of two rows. We ask what supplies this capacity and whether the permanent shares it. On a communication graph, determinant-one moves of adjacent pairs generate the full special linear group on each connected component, so the reachable matrices are those sharing each component''s exterior product of rows. Agents can reach a form whose determinant is readable from per-row summaries exactly when the pivot profiles of the components'' row spaces are disjoint, and a randomised local protocol then reaches it with probability one. Exhaustive checks over 1,381,440 matrix-graph pairs and 400 seeded trials over $\mathbb{F}_{101}$ agree with these theorems. In characteristic other than two we prove that the only linear maps of two rows preserving the permanent in every matrix of size at least three are scalings and exchanges, against all of $\mathrm{SL}_2$ for the determinant, so agents restricted to them never create a zero. State-dependent moves remove this rigidity at size three: every $3\times 3$ matrix over $\mathbb{F}_5$ with nonzero permanent can reach a readable form. From size five a rank-two completion argument restores it: over $\mathbb{F}_p$ at most a fraction $4n/p$ of row pairs admit a permanent-preserving replacement beyond scalings and exchanges. The results do not bear on whether VP differs from VNP.'
